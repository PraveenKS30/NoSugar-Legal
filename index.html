<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No Sugar Support</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fdf3e3;
      --surface: #fffaf2;
      --text: #3a2a1e;
      --muted: #705c4b;
      --accent: #c94b2b;
      --border: #e8d9c2;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(680px, calc(100% - 40px));
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 16px 40px rgba(194, 120, 60, 0.12);
    }

    h1 {
      margin: 0 0 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 7vw, 54px);
      line-height: 1;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.55;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    a {
      color: var(--accent);
      font-weight: 700;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>No Sugar</h1>
    <p>No Sugar is a personal sugar-free habit tracker built to help you log daily progress, ride out cravings, and keep your data understandable.</p>
    <p>For support, privacy requests, or account questions, email <a href="mailto:c2praveen30jun@gmail.com">c2praveen30jun@gmail.com</a>.</p>
    <nav aria-label="Legal links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
    </nav>
  </main>
</body>
</html>
